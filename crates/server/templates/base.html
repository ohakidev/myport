<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/site.css?v=0.5.1">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="Ohaki home">ohaki<span aria-hidden="true">/</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/"{% if current == "home" %} aria-current="page"{% endif %}>Home</a>
        <a href="/work"{% if current == "work" %} aria-current="page"{% endif %}>Work</a>
        <a href="/play"{% if current == "play" %} aria-current="page"{% endif %}>Playground</a>
      </nav>
      <a class="profile-link" href="https://github.com/ohakidev">GitHub <span aria-hidden="true">↗</span></a>
    </header>
    <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <a href="/" class="footer-name">ohaki / web development</a>
      <a href="https://github.com/ohakidev">GitHub profile <span aria-hidden="true">↗</span></a>
    </footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
