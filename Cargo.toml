[workspace]
members = ["crates/server", "crates/play"]
resolver = "3"

[workspace.dependencies]
askama = "0.14"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

[package]
name = "myport-vercel"
version = "0.3.0"
edition = "2024"
publish = false

[[bin]]
name = "axum"
path = "api/axum.rs"

[dependencies]
askama.workspace = true
axum.workspace = true
reqwest.workspace = true
serde.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
vercel_runtime.workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.release.package.myport-play]
opt-level = "s"
